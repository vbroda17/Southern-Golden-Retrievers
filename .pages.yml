# Pages CMS configuration (https://app.pagescms.org)
# Defines the forms used to update litters and the FAQ without editing code.
# Saving in Pages CMS commits to the selected branch; saves on `main` go live automatically.
#
# Keep in sync with the checks the site runs at build time:
#   - Litters: astro-site/src/content.config.ts
#     - dam choices below should match the dam galleries in astro-site/src/assets/images/
#     - status choices must match PUPPY_STATUSES in astro-site/src/config.js
#   - FAQ: astro-site/src/faq.js

media:
  input: astro-site/src/assets/images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: litters
    label: Litters
    type: collection
    path: astro-site/src/content/litters
    format: yaml
    filename: "{dam}-{year}-{month}.yml"
    view:
      primary: dam
      fields: [dam, sire, born]
      sort: born
      order: desc
    fields:
      - name: dam
        label: Mom (dam)
        type: select
        required: true
        options:
          values: [Lilly, Roux, Raine]

      - name: damPhoto
        label: Mom's photo (optional)
        description: Leave empty to use the first photo from her gallery on the Dams page.
        type: image
        options:
          path: astro-site/src/assets/images

      - name: sire
        label: Dad (sire)
        type: string
        required: true

      - name: sirePhoto
        label: Dad's photo
        type: image
        options:
          path: astro-site/src/assets/images/sires

      - name: born
        label: Date born
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: readyDate
        label: Ready to go home
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: puppies
        label: Puppies
        description: Leave empty until the puppies have names. The page will say details are coming soon.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} - {status}"
        fields:
          - name: name
            label: Name
            type: string
            required: true

          - name: photo
            label: Photo
            type: image
            options:
              path: astro-site/src/assets/images/litters

          - name: gender
            label: Gender
            type: select
            required: true
            options:
              values: [Male, Female]

          - name: color
            label: Color
            type: string
            required: true

          - name: status
            label: Status
            description: Available shows a "Contact About" button. Available puppies are listed first.
            type: select
            required: true
            options:
              values: [Available, Reserved, Adopted]

          - name: description
            label: Description (optional)
            type: text

  - name: faq
    label: FAQ
    type: file
    path: astro-site/src/content/faq.json
    format: json
    fields:
      - name: intro
        label: Intro
        description: Short line shown under the "Frequently Asked Questions" title.
        type: text

      - name: sections
        label: Sections
        description: Groups of questions, e.g. "Getting a Puppy". Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Section title
            type: string
            required: true

          - name: questions
            label: Questions
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                label: Question
                type: string
                required: true

              - name: answer
                label: Answer
                description: Leave a blank line between paragraphs. Questions with no answer yet are hidden on the site.
                type: text
